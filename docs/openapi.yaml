openapi: 3.0.3
info:
  title: Medislot API
  version: 1.0.0
  description: REST API specification for a medical appointment scheduling system.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Health
  - name: Sessions
  - name: Users
  - name: Doctors
  - name: Schedule Periods
  - name: Calendars
  - name: Appointments
paths:
  /health:
    get:
      tags: [Health]
      summary: Check whether the API is available
      operationId: getHealth
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /sessions:
    post:
      tags: [Sessions]
      summary: Create an access token for an existing user
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    post:
      tags: [Users]
      summary: Register a new patient account
      description: Public registration creates only users with the PATIENT role.
      operationId: registerPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientRegistrationRequest"
      responses:
        "200":
          description: Patient account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Users]
      summary: List users
      description: Admins can list all user types. Receptionists can use this endpoint only to search patients; non-patient accounts are never returned to receptionists.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleQuery"
        - $ref: "#/components/parameters/UserSearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Users returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get a single user by id
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: User returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user's information
      operationId: updateUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Delete a user account
      operationId: deleteUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "204":
          description: User deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userId}/appointments:
    get:
      tags: [Appointments]
      summary: List appointments belonging to one patient
      operationId: listAppointmentsByUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
        - $ref: "#/components/parameters/AppointmentStatusQuery"
      responses:
        "200":
          description: Appointments returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /doctors:
    get:
      tags: [Doctors]
      summary: List all doctors
      operationId: listDoctors
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          description: Search doctors by name or email.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - in: query
          name: specialization
          required: false
          description: Exact specialization enum filter; substring matching is not supported.
          schema:
            $ref: "#/components/schemas/Specialization"
      responses:
        "200":
          description: Doctors returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Doctor"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Doctors]
      summary: Create a doctor account and doctor profile
      description: Only an admin can create doctor staff accounts.
      operationId: createDoctor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDoctorCreateRequest"
      responses:
        "200":
          description: Doctor account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /receptionists:
    post:
      tags: [Users]
      summary: Create a receptionist account
      description: Only an admin can create receptionist staff accounts.
      operationId: createReceptionist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReceptionistCreateRequest"
      responses:
        "200":
          description: Receptionist account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /managers:
    post:
      tags: [Users]
      summary: Create a manager account
      description: Only an admin can create manager staff accounts. The server assigns the MANAGER role.
      operationId: createManager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminManagerCreateRequest"
      responses:
        "201":
          description: Manager account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /doctors/{doctorId}:
    get:
      tags: [Doctors]
      summary: Get a single doctor by id
      operationId: getDoctorById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdPath"
      responses:
        "200":
          description: Doctor returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Doctors]
      summary: Update a doctor's information
      operationId: updateDoctorById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorUpdateRequest"
      responses:
        "200":
          description: Doctor updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Doctors]
      summary: Delete a doctor account and profile
      description: Deletes both the doctor row and the linked user account.
      operationId: deleteDoctorById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdPath"
      responses:
        "204":
          description: Doctor and linked user account deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /doctors/{doctorId}/appointments:
    get:
      tags: [Appointments]
      summary: List appointments for one doctor
      description: Only admins can list appointments through this endpoint.
      operationId: listAppointmentsByDoctor
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdPath"
        - $ref: "#/components/parameters/AppointmentStatusQuery"
      responses:
        "200":
          description: Appointments returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedulePeriods:
    post:
      tags: [Schedule Periods]
      summary: Publish a generated schedule period and its retained slots
      description: >
        ADMIN and MANAGER only. Regenerates the Warsaw preview from configuration;
        removedSlotIds are unique zero-based indexes into its chronological slots.
        Client-supplied slot times are ignored. At least one full slot must remain
        and every retained start must be in the future. Inclusive date ranges may
        not overlap an existing period for the same doctor, including dates with
        no retained slots. Retained slot intervals may not overlap existing calendar
        slots. Conflicts return 409. The period and slots are saved atomically.
        Per-doctor database row locking serializes publication and manual calendar writes.
        Legacy and manually created calendar slots may have no schedule period;
        every slot created here references the newly created period.
      operationId: publishSchedulePeriod
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SchedulePreviewRequest"
                - type: object
                  required: [removedSlotIds]
                  properties:
                    removedSlotIds:
                      type: array
                      uniqueItems: true
                      description: Zero-based indexes in the server-generated preview; use an empty array to retain all slots.
                      items:
                        type: integer
                        minimum: 0
                      example: [0, 1]
      responses:
        "201":
          description: Period and all retained calendar slots published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedSchedulePeriod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /schedulePeriods/preview:
    post:
      tags: [Schedule Periods]
      summary: Preview a doctor's generated schedule slots
      description: >
        Admins and managers only. Generates slots for the inclusive local date range in Europe/Warsaw.
        The selected weekdays are filtered by excluded dates. Slots are contiguous within
        each working day and have the requested elapsed duration; incomplete slots are omitted.
        An ambiguous or nonexistent local daily boundary on a working day returns 400.
        The preview is limited to 366 days and 10000 slots. It does not persist anything
        or check for conflicts with existing slots.
      operationId: previewSchedulePeriod
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePreviewRequest"
      responses:
        "200":
          description: Generated slots in chronological order, with UTC timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calendars:
    get:
      tags: [Calendars]
      summary: List calendar slots
      description: Patients can browse free slots, while staff can filter doctor schedules by date and booking status.
      operationId: listCalendarSlots
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdQuery"
        - $ref: "#/components/parameters/CalendarDateQuery"
        - $ref: "#/components/parameters/CalendarBookedQuery"
      responses:
        "200":
          description: Calendar slots returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Calendar"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Calendars]
      summary: Create a calendar slot
      description: Doctors or admins create bookable time slots in the clinic schedule.
      operationId: createCalendarSlot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarCreateRequest"
      responses:
        "200":
          description: Calendar slot created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /calendars/block:
    post:
      tags: [Calendars]
      summary: Block existing published slots and flag confirmed appointments
      description: >
        ADMIN and MANAGER only. Accepts offset-qualified timestamps and requires startTime
        before endTime. In a doctor-locked transaction, blocks existing published slots
        where slot.startTime < endTime and slot.endTime > startTime, and changes only
        CONFIRMED appointments on those slots to NEEDS_RESCHEDULING. Appointment identity,
        reason and original slot times are preserved. Repeating the same block is safe.
        Counts describe newly blocked slots and newly flagged appointments. Legacy/manual
        slots are excluded. No persistent unavailability interval is stored: later
        publication in a previously empty part of this range is not automatically blocked.
      operationId: blockCalendarSlots
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorId, startTime, endTime]
              properties:
                doctorId:
                  type: integer
                  minimum: 1
                startTime:
                  type: string
                  format: date-time
                  example: "2030-01-07T09:00:00+01:00"
                endTime:
                  type: string
                  format: date-time
                  example: "2030-01-07T11:00:00+01:00"
      responses:
        "201":
          description: Blocking operation committed atomically
          content:
            application/json:
              schema:
                type: object
                required: [blockedSlots, appointmentsNeedingRescheduling]
                properties:
                  blockedSlots:
                    type: integer
                    minimum: 0
                  appointmentsNeedingRescheduling:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calendars/{calendarId}:
    get:
      tags: [Calendars]
      summary: Get a single calendar slot
      operationId: getCalendarSlotById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CalendarIdPath"
      responses:
        "200":
          description: Calendar slot returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Calendars]
      summary: Update a calendar slot
      description: Doctors or admins update manual slot times or booking availability. Published slot times and doctor are immutable; isBlocked is not client-editable.
      operationId: updateCalendarSlotById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CalendarIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarUpdateRequest"
      responses:
        "200":
          description: Calendar slot updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Calendars]
      summary: Delete a calendar slot
      description: Unbooked slots can be removed from the doctor schedule.
      operationId: deleteCalendarSlotById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CalendarIdPath"
      responses:
        "204":
          description: Calendar slot deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      description: Use query parameters such as `status` to filter appointments for receptionist or doctor views.
      operationId: listAppointments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentStatusQuery"
      responses:
        "200":
          description: Appointments returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Appointments]
      summary: Create a new appointment from an available calendar slot
      description: Online and staff-created bookings are confirmed immediately when the selected calendar slot is still available.
      operationId: requestAppointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreateRequest"
      responses:
        "200":
          description: Appointment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /appointments/{appointmentId}:
    get:
      tags: [Appointments]
      summary: Get a single appointment by id
      operationId: getAppointmentById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      responses:
        "200":
          description: Appointment returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Appointments]
      summary: Update appointment status
      description: Receptionists or clinic staff update operational statuses such as `CANCELLED` or `NO_SHOW`, and completed visits can be marked as `COMPLETED`.
      operationId: reviewAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdateRequest"
      responses:
        "200":
          description: Appointment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Appointments]
      summary: Delete an appointment
      description: Appointments awaiting rescheduling cannot be deleted; returns 409.
      operationId: deleteAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      responses:
        "204":
          description: Appointment deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIdPath:
      in: path
      name: userId
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    DoctorIdPath:
      in: path
      name: doctorId
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    CalendarIdPath:
      in: path
      name: calendarId
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    AppointmentIdPath:
      in: path
      name: appointmentId
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    DoctorIdQuery:
      in: query
      name: doctorId
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
    CalendarDateQuery:
      in: query
      description: Filter by the slot start date in Europe/Warsaw (clinic midnight inclusive to next midnight exclusive).
      name: date
      required: false
      schema:
        type: string
        format: date
    CalendarBookedQuery:
      in: query
      description: When false, only unbooked AND unblocked slots are returned.
      name: isBooked
      required: false
      schema:
        type: boolean
    RoleQuery:
      in: query
      name: role
      required: false
      schema:
        $ref: "#/components/schemas/Role"
    UserSearchQuery:
      in: query
      name: search
      required: false
      description: Case-insensitive search by user name or email.
      schema:
        type: string
        minLength: 2
        maxLength: 100
    PageQuery:
      in: query
      name: page
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSizeQuery:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    AppointmentStatusQuery:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/AppointmentStatus"

  responses:
    BadRequest:
      description: Request body or parameters failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing token or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user does not have permission for this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists or violates a uniqueness constraint
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    PublishedSchedulePeriod:
      type: object
      required: [id, doctorId, startDate, endDate, workingWeekdays, dailyStartTime, dailyEndTime, slotDurationMinutes, excludedDates, removedSlotIds, publishedById, createdAt, timeZone, slotCount]
      properties:
        id:
          type: integer
        doctorId:
          type: integer
        startDate:
          type: string
          format: date-time
          description: Inclusive civil date stored as a PostgreSQL DATE and serialized at UTC midnight.
        endDate:
          type: string
          format: date-time
        workingWeekdays:
          type: array
          items:
            type: integer
        dailyStartTime:
          type: string
        dailyEndTime:
          type: string
        slotDurationMinutes:
          type: integer
        excludedDates:
          type: array
          items:
            type: string
            format: date
        removedSlotIds:
          type: array
          items:
            type: integer
        publishedById:
          type: integer
          description: Authenticated publishing user, assigned by the server.
        createdAt:
          type: string
          format: date-time
        timeZone:
          type: string
          enum: [Europe/Warsaw]
        slotCount:
          type: integer
          minimum: 1

    SchedulePreviewRequest:
      type: object
      required: [doctorId, startDate, endDate, workingWeekdays, dailyStartTime, dailyEndTime, slotDurationMinutes, excludedDates]
      properties:
        doctorId:
          type: integer
          minimum: 1
          maximum: 2147483647
        startDate:
          type: string
          format: date
          example: "2026-11-16"
        endDate:
          type: string
          format: date
          example: "2026-11-20"
        workingWeekdays:
          type: array
          minItems: 1
          uniqueItems: true
          description: ISO weekday numbers (Monday is 1, Sunday is 7).
          items:
            type: integer
            minimum: 1
            maximum: 7
          example: [1, 3, 5]
        dailyStartTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:00"
        dailyEndTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Must be later than dailyStartTime on the same day.
          example: "12:00"
        slotDurationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 30
        excludedDates:
          type: array
          uniqueItems: true
          items:
            type: string
            format: date
          example: ["2026-11-18"]

    SchedulePreviewResponse:
      type: object
      required: [doctorId, timeZone, slots]
      properties:
        doctorId:
          type: integer
        timeZone:
          type: string
          enum: [Europe/Warsaw]
        slots:
          type: array
          items:
            type: object
            required: [startTime, endTime]
            properties:
              startTime:
                type: string
                format: date-time
              endTime:
                type: string
                format: date-time

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          example: Validation failed
        code:
          type: string
          example: BAD_REQUEST
        details:
          type: array
          items:
            type: string

    Specialization:
      type: string
      enum: [GENERAL_PRACTICE, CARDIOLOGY, NEUROLOGY, ORTHOPAEDICS, PEDIATRICS, DERMATOLOGY, OPHTHALMOLOGY, ENT, GYNAECOLOGY, UROLOGY]
      description: Fixed doctor specialization code. ENT is displayed as Ear, nose and throat.

    NullableSpecialization:
      type: string
      nullable: true
      enum: [GENERAL_PRACTICE, CARDIOLOGY, NEUROLOGY, ORTHOPAEDICS, PEDIATRICS, DERMATOLOGY, OPHTHALMOLOGY, ENT, GYNAECOLOGY, UROLOGY, null]
      description: Legacy records and non-doctors may have no specialization.

    Role:
      type: string
      enum: [PATIENT, DOCTOR, RECEPTIONIST, ADMIN, MANAGER]

    AppointmentStatus:
      type: string
      enum: [CONFIRMED, CANCELLED, COMPLETED, NO_SHOW, NEEDS_RESCHEDULING]

    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Anna Kowalska
        email:
          type: string
          format: email
          example: anna.kowalska@example.com
        role:
          $ref: "#/components/schemas/Role"
        specialization:
          $ref: "#/components/schemas/NullableSpecialization"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-11T10:30:00Z"

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 10
        total:
          type: integer
          format: int32
          minimum: 0
          example: 23
        totalPages:
          type: integer
          format: int32
          minimum: 0
          example: 3

    UserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    PatientRegistrationRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255

    UserUpdateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email

    SessionCreateRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255

    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken:
          type: string
          minLength: 20
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
        tokenType:
          type: string
          example: Bearer

    Doctor:
      type: object
      required: [id, userId, specialization, user]
      properties:
        id:
          type: integer
          format: int32
          example: 10
        userId:
          type: integer
          format: int32
          minimum: 1
          example: 2
        specialization:
          $ref: "#/components/schemas/NullableSpecialization"
        user:
          $ref: "#/components/schemas/User"

    AdminReceptionistCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255

    AdminManagerCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255

    AdminDoctorCreateRequest:
      type: object
      required: [name, email, password, specialization]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255
        specialization:
          $ref: "#/components/schemas/Specialization"

    DoctorUpdateRequest:
      type: object
      required: [specialization]
      properties:
        specialization:
          $ref: "#/components/schemas/Specialization"

    Calendar:
      type: object
      required: [id, doctorId, startTime, endTime, isBooked, isBlocked, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int32
          example: 20
        doctorId:
          type: integer
          format: int32
          minimum: 1
          example: 10
        startTime:
          type: string
          format: date-time
          example: "2026-05-21T15:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2026-05-21T15:30:00Z"
        isBlocked:
          type: boolean
          readOnly: true
          description: Independent of reservations; cancellation never clears a block.
        isBooked:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-05-20T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-20T10:00:00Z"
        doctor:
          $ref: "#/components/schemas/Doctor"

    CalendarCreateRequest:
      type: object
      required: [doctorId, startTime, endTime]
      properties:
        doctorId:
          type: integer
          format: int32
          minimum: 1
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time

    CalendarUpdateRequest:
      type: object
      additionalProperties: false
      required: [startTime, endTime, isBooked]
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isBooked:
          type: boolean

    Appointment:
      type: object
      required:
        [id, patientId, doctorId, calendarId, status, reason, patient, doctor]
      properties:
        id:
          type: integer
          format: int32
          example: 100
        patientId:
          type: integer
          format: int32
          minimum: 1
          example: 1
        doctorId:
          type: integer
          format: int32
          minimum: 1
          example: 10
        calendarId:
          type: integer
          format: int32
          minimum: 1
          example: 20
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: Follow-up consultation for blood pressure results
        slotStartTime:
          type: string
          format: date-time
          example: "2026-05-20T14:00:00Z"
          description: Read-only value derived from the linked calendar slot.
        slotEndTime:
          type: string
          format: date-time
          example: "2026-05-20T14:30:00Z"
          description: Read-only value derived from the linked calendar slot.
        patient:
          $ref: "#/components/schemas/User"
        doctor:
          $ref: "#/components/schemas/Doctor"

    AppointmentCreateRequest:
      type: object
      required: [patientId, doctorId, calendarId, reason]
      properties:
        patientId:
          type: integer
          format: int32
          minimum: 1
        doctorId:
          type: integer
          format: int32
          minimum: 1
        calendarId:
          type: integer
          format: int32
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 500

    AppointmentUpdateRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [CONFIRMED, CANCELLED, COMPLETED, NO_SHOW]
          description: NEEDS_RESCHEDULING is server-assigned; such appointments may only be cancelled here.
        reason:
          type: string
          minLength: 5
          maxLength: 500

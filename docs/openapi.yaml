openapi: 3.0.3
info:
  title: Medislot API
  version: 1.0.0
  description: REST API specification for a medical appointment scheduling system.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Health
  - name: Sessions
  - name: Users
  - name: Doctors
  - name: Schedule Periods
  - name: Calendars
  - name: Appointments
paths:
  /health:
    get:
      tags: [Health]
      summary: Check whether the API is available
      operationId: getHealth
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /sessions:
    post:
      tags: [Sessions]
      summary: Create an access token for an existing user
      description: Closed accounts cannot sign in. Tokens carry an authentication version checked against the current account on every authenticated request.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    post:
      tags: [Users]
      summary: Register a new patient account
      description: Public registration creates only users with the PATIENT role.
      operationId: registerPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientRegistrationRequest"
      responses:
        "200":
          description: Patient account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnPatientProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Users]
      summary: List users
      description: Admins can list all user types. Receptionists can use this endpoint only to search patients; non-patient accounts are never returned to receptionists. Explicit role=MANAGER listing is ADMIN-only.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleQuery"
        - $ref: "#/components/parameters/UserSearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Users returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/me/close:
    post:
      tags: [Users]
      summary: Close the authenticated patient's own account
      description: >-
        Requires current password and explicit confirmation. Cancels future confirmed and all
        disrupted visits using post-lock database time. In-progress, ended and terminal visits
        remain unchanged. Login/contact details are removed; linked appointment, rescheduling
        and contact history including reasons/notes remains for authorized staff. This is not
        anonymization or full erasure. Unsent email work is suppressed; already in-flight or
        externally accepted messages cannot reliably be recalled. The same requestId can replay
        the committed success without writes using the original token only on this endpoint.
        All other requests with closed-account tokens are rejected. Unversioned JWTs require login.
      operationId: closeOwnPatientAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, confirmed, requestId]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 255, writeOnly: true }
                confirmed: { type: boolean, enum: [true] }
                requestId: { type: string, format: uuid, description: A stable UUID v4 for this closure attempt and its retries. }
      responses:
        "200":
          description: Account closed or committed closure receipt replayed without writes
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: { type: boolean, enum: [true] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get a single user by id
      description: Own patient profile includes private phone. Generic staff reads and other endpoints omit phone.
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: User returned successfully
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/OwnPatientProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user's information
      description: Phone updates are permitted only by the patient editing their own profile. Existing name/email permissions are unchanged.
      operationId: updateUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/OwnPatientProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Delete a user account
      description: ADMIN only. Patient accounts must use own-account closure; hard deletion is rejected. All appointment and status/rescheduling history is retained; referenced audit actors cannot be hard-deleted.
      operationId: deleteUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "204":
          description: User deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userId}/appointments:
    get:
      tags: [Appointments]
      summary: List appointments belonging to one patient
      operationId: listAppointmentsByUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
        - $ref: "#/components/parameters/AppointmentStatusQuery"
      responses:
        "200":
          description: Appointments returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /doctors:
    get:
      tags: [Doctors]
      summary: List all doctors
      operationId: listDoctors
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          description: Search doctors by name or email.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - in: query
          name: specialization
          required: false
          description: Exact specialization enum filter; substring matching is not supported.
          schema:
            $ref: "#/components/schemas/Specialization"
      responses:
        "200":
          description: Doctors returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Doctor"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Doctors]
      summary: Create a doctor account and doctor profile
      description: Only an admin can create doctor staff accounts.
      operationId: createDoctor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDoctorCreateRequest"
      responses:
        "200":
          description: Doctor account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /receptionists:
    post:
      tags: [Users]
      summary: Create a receptionist account
      description: Only an admin can create receptionist staff accounts.
      operationId: createReceptionist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReceptionistCreateRequest"
      responses:
        "200":
          description: Receptionist account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /managers:
    post:
      tags: [Users]
      summary: Create a manager account
      description: Only an admin can create manager staff accounts. The server assigns the MANAGER role.
      operationId: createManager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminManagerCreateRequest"
      responses:
        "201":
          description: Manager account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /doctors/{doctorId}:
    get:
      tags: [Doctors]
      summary: Get a single doctor by id
      operationId: getDoctorById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdPath"
      responses:
        "200":
          description: Doctor returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Doctors]
      summary: Update a doctor's information
      operationId: updateDoctorById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorUpdateRequest"
      responses:
        "200":
          description: Doctor updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Doctors]
      summary: Delete a doctor account and profile
      description: ADMIN only. Returns 409 if any appointment or status/rescheduling audit would be erased; records must be retained.
      operationId: deleteDoctorById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdPath"
      responses:
        "204":
          description: Doctor and linked user account deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

        "409":
          $ref: "#/components/responses/Conflict"

  /doctors/{doctorId}/appointments:
    get:
      tags: [Appointments]
      summary: List appointments for one doctor
      description: Only admins can list appointments through this endpoint.
      operationId: listAppointmentsByDoctor
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdPath"
        - $ref: "#/components/parameters/AppointmentStatusQuery"
      responses:
        "200":
          description: Appointments returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedulePeriods:
    post:
      tags: [Schedule Periods]
      summary: Publish a generated schedule period and its retained slots
      description: >
        ADMIN and MANAGER only. Regenerates the Warsaw preview from configuration;
        removedSlotIds are unique zero-based indexes into its chronological slots.
        Client-supplied slot times are ignored. At least one full slot must remain
        and every retained start must be in the future. Inclusive date ranges may
        not overlap an existing period for the same doctor, including dates with
        no retained slots. Retained slot intervals may not overlap existing calendar
        slots. Conflicts return 409. The period and slots are saved atomically.
        Per-doctor database row locking serializes publication and manual calendar writes.
        Legacy and manually created calendar slots may have no schedule period;
        every slot created here references the newly created period.
      operationId: publishSchedulePeriod
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SchedulePreviewRequest"
                - type: object
                  required: [removedSlotIds]
                  properties:
                    removedSlotIds:
                      type: array
                      uniqueItems: true
                      description: Zero-based indexes in the server-generated preview; use an empty array to retain all slots.
                      items:
                        type: integer
                        minimum: 0
                      example: [0, 1]
      responses:
        "201":
          description: Period and all retained calendar slots published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedSchedulePeriod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /schedulePeriods/preview:
    post:
      tags: [Schedule Periods]
      summary: Preview a doctor's generated schedule slots
      description: >
        Admins and managers only. Generates slots for the inclusive local date range in Europe/Warsaw.
        The selected weekdays are filtered by excluded dates. Slots are contiguous within
        each working day and have the requested elapsed duration; incomplete slots are omitted.
        An ambiguous or nonexistent local daily boundary on a working day returns 400.
        The preview is limited to 366 days and 10000 slots. It does not persist anything
        or check for conflicts with existing slots.
      operationId: previewSchedulePeriod
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePreviewRequest"
      responses:
        "200":
          description: Generated slots in chronological order, with UTC timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calendars:
    get:
      tags: [Calendars]
      summary: List calendar slots
      description: Patients receive only future, published, unblocked, unbooked slots; booking-status filters cannot broaden this visibility. Staff, including MANAGER, retain calendar read access and may filter by booking status. Manager calendar reads do not grant calendar create/update/delete permission; existing preview/publish/block permissions are unchanged. Manager nested doctor identities omit contact/profile data. Dates use Europe/Warsaw clinic days. Valid filters with no matches return an empty data array.
      operationId: listCalendarSlots
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DoctorIdQuery"
        - $ref: "#/components/parameters/CalendarDateQuery"
        - $ref: "#/components/parameters/CalendarBookedQuery"
      responses:
        "200":
          description: Calendar slots returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Calendars]
      summary: Create a calendar slot
      description: Doctors or admins create bookable time slots in the clinic schedule.
      operationId: createCalendarSlot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarCreateRequest"
      responses:
        "200":
          description: Calendar slot created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /calendars/block:
    post:
      tags: [Calendars]
      summary: Block existing published slots and flag confirmed appointments
      description: >
        ADMIN and MANAGER only. Accepts offset-qualified timestamps and requires startTime
        before endTime. In a doctor-locked transaction, blocks existing published slots
        where slot.startTime > post-lock server time, slot.startTime < endTime and slot.endTime > startTime. Started and ended slots remain unchanged. It changes only
        CONFIRMED appointments on those slots to NEEDS_RESCHEDULING. Appointment identity,
        reason and original slot times are preserved. Repeating the same block is safe.
        Each changed appointment version increments and appends an atomic status-transition audit with actor and server time; repeating a block without changing status does not increment it. Closed-patient appointments are not disrupted.
        Counts describe newly blocked slots and newly flagged appointments. Legacy/manual
        slots are excluded. No persistent unavailability interval is stored: later
        publication in a previously empty part of this range is not automatically blocked.
        Each newly transitioned appointment creates one patient notification and immediately
        eligible durable email job in this same transaction, keyed by its new version.
        Repeat blocking creates no duplicate notices/jobs. No SMTP call occurs in the transaction;
        insert failure rolls back blocking. Successful recovery/cancellation resolves notices
        and skips unsent jobs without changing read status. Failed initial bookings create none.
      operationId: blockCalendarSlots
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorId, startTime, endTime]
              properties:
                doctorId:
                  type: integer
                  minimum: 1
                startTime:
                  type: string
                  format: date-time
                  example: "2030-01-07T09:00:00+01:00"
                endTime:
                  type: string
                  format: date-time
                  example: "2030-01-07T11:00:00+01:00"
      responses:
        "201":
          description: Blocking operation committed atomically
          content:
            application/json:
              schema:
                type: object
                required: [blockedSlots, appointmentsNeedingRescheduling]
                properties:
                  blockedSlots:
                    type: integer
                    minimum: 0
                  appointmentsNeedingRescheduling:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calendars/{calendarId}/alternatives:
    get:
      tags: [Calendars]
      summary: Suggest another time for a failed initial booking
      description: >
        PATIENT, RECEPTIONIST or ADMIN only. Patients always use their authenticated identity,
        ignoring supplied patientId. Staff must supply an existing PATIENT ID. Derives doctor,
        duration and requested start from the referenced slot; never reads or returns its booking
        or patient details. Same doctor only, even with null specialization. Searches the requested
        Europe/Warsaw clinic date and the following 14 calendar days inclusive, across DST.
        Two independent groups of at most 3: sameDay by absolute proximity to requested start,
        laterDates earliest first. Ties use start time then slot ID. Requires future, published,
        unbooked, unblocked slots of matching duration, excluding the source and the patient's
        CONFIRMED overlaps (back-to-back allowed). Expired windows return empty groups.
        Retrieval creates no holds, appointments or history. ADMIN retains read-only retrieval but cannot submit an alternative booking; POST /appointments allows only PATIENT and RECEPTIONIST. Selecting an alternative must be
        explicitly confirmed using POST /appointments to create a NEW booking, never reschedule.
      operationId: listInitialBookingAlternatives
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: patientId
          in: query
          required: false
          description: Required for ADMIN/RECEPTIONIST; ignored for PATIENT identity.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Derived requested slot, effective patient ID, inclusive clinic-date window and suggestion groups. No other patient data.
          content:
            application/json:
              schema:
                type: object
                required: [requestedSlot, patientId, window, sameDay, laterDates]
                properties:
                  requestedSlot:
                    $ref: "#/components/schemas/Calendar"
                  patientId:
                    type: integer
                  window:
                    type: object
                    required: [startDate, endDate, timeZone]
                    properties:
                      startDate:
                        type: string
                        format: date
                      endDate:
                        type: string
                        format: date
                      timeZone:
                        type: string
                        enum: [Europe/Warsaw]
                  sameDay:
                    type: array
                    maxItems: 3
                    items:
                      $ref: "#/components/schemas/Calendar"
                  laterDates:
                    type: array
                    maxItems: 3
                    items:
                      $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calendars/{calendarId}:
    get:
      tags: [Calendars]
      summary: Get a single calendar slot
      description: Patients can read only future, published, unblocked, unbooked slots; other slots return 404. Own appointments remain accessible through the appointment API. Staff retain existing calendar access.
      operationId: getCalendarSlotById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CalendarIdPath"
      responses:
        "200":
          description: Calendar slot returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Calendars]
      summary: Update a calendar slot
      description: Doctors or admins update manual slot times or booking availability. Published slot times and doctor are immutable; isBlocked is not client-editable.
      operationId: updateCalendarSlotById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CalendarIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarUpdateRequest"
      responses:
        "200":
          description: Calendar slot updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Calendars]
      summary: Delete a calendar slot
      description: Unbooked slots can be removed from the doctor schedule.
      operationId: deleteCalendarSlotById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CalendarIdPath"
      responses:
        "204":
          description: Calendar slot deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rescheduling/followUps:
    get:
      tags: [Follow-up]
      summary: List active escalated doctor-disruption cases
      description: >
        RECEPTIONIST and MANAGER may follow up; ADMIN is read-only here. DOCTOR/PATIENT denied.
        Unresolved exact calendar/version cases only, ordered by effectiveEscalationAt then case ID.
        Deadlines use the recorded slot and elapsed hours; terminal email failure escalates immediately.
        Empty recommendations never escalate. Reading or logging contact never resolves a case.
        Legacy scheduled deadlines/recording instants remain unknown; unresolved legacy cases
        receive a distinct immediate migration fallback timestamp and LEGACY_FALLBACK reason.
        Phone hours are 08:00 inclusive to 20:00 exclusive Europe/Warsaw; overdue deadlines are retained.
        Returns current patient contact details but no visit reasons or email-job internals.
      operationId: listFollowUps
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Active cases and consistent pagination totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/FollowUpCase" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
                  asOf: { type: string, format: date-time }
                  timeZone: { type: string, enum: [Europe/Warsaw] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /rescheduling/followUps/legacyAppointments:
    get:
      tags: [Appointments]
      summary: Browse legacy disrupted appointments without a current notification
      description: >-
        RECEPTIONIST, MANAGER and ADMIN only. Read-only, paginated discovery restricted
        to open patients' NEEDS_RESCHEDULING visits for which no notification exists for
        the current appointment/version. Does not return ordinary appointments or create
        notifications, jobs or historical events. Generic appointment serialization omits phone.
        Managers/receptionists can confirm legacy cancellation from the follow-up page;
        admin follow-up controls remain read-only with existing appointment management unchanged.
      operationId: listLegacyDisruptedAppointments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Current legacy appointment snapshots and pagination
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /rescheduling/followUps/cases:
    get:
      tags: [Follow-up]
      summary: Browse real active or resolved disruption cases for contact history
      description: >
        RECEPTIONIST, MANAGER and ADMIN only. ACTIVE includes all unresolved disruption cases,
        including those not yet escalated. RESOLVED includes retained and detached history.
        Does not change the active escalation queue or resolve anything. Current patient name
        may be null after deletion; original doctor/time snapshots and notification IDs remain.
        No visit reasons, phones, passwords or contact notes are returned in case summaries.
        Rows and totals share a repeatable-read snapshot. Active order is createdAt/ID descending;
        resolved order is resolvedAt/ID descending.
      operationId: browseFollowUpCases
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, RESOLVED], default: ACTIVE } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Real case selection, with an empty data array when no cases match
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        notificationId: { type: integer }
                        appointmentRef: { type: integer }
                        appointmentId: { type: integer, nullable: true }
                        disruptionVersion: { type: integer }
                        patientName: { type: string, nullable: true }
                        doctorName: { type: string }
                        slotStartTime: { type: string, format: date-time }
                        slotEndTime: { type: string, format: date-time }
                        createdAt: { type: string, format: date-time }
                        resolvedAt: { type: string, format: date-time, nullable: true }
                        contactCount: { type: integer }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /rescheduling/followUps/{notificationId}/contactAttempts:
    get:
      tags: [Follow-up]
      summary: Read case-scoped contact history, including resolved/detached cases
      description: RECEPTIONIST, MANAGER, ADMIN only. Append-only records; actorId may be null after deletion. No phone snapshots.
      operationId: getContactHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Preserved case contact history
          content:
            application/json:
              schema:
                type: object
                properties:
                  case:
                    type: object
                    properties:
                      id: { type: integer }
                      appointmentRef: { type: integer }
                      disruptionVersion: { type: integer }
                      resolvedAt: { type: string, format: date-time, nullable: true }
                  data: { type: array, items: { $ref: "#/components/schemas/ContactAttempt" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appointments/{appointmentId}/contactAttempts:
    post:
      tags: [Follow-up]
      summary: Record contact for the exact current unresolved disruption
      description: >
        RECEPTIONIST/MANAGER only. Actor and timestamp are server-derived after locking.
        Requires current phone and Warsaw contact hours. No retrospective or post-resolution
        new entries. Does not change appointment status/version or notification read/resolution state.
        Same case/key/payload/actor replays the original result, including after resolution or allowed deletion;
        changed payload or stale case/calendar/version returns 409 with reload guidance.
        Notes are plain text, at most 500 characters; retries are manually arranged.
      operationId: recordContactAttempt
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AppointmentIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactAttemptRequest" }
      responses:
        "201":
          description: Contact saved or identical idempotent replay; no other state changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactAttempt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /notifications:
    get:
      tags: [Notifications]
      summary: List the authenticated patient's disruption notices
      description: >
        PATIENT only. Recipient is always the authenticated user; caller-supplied recipient
        IDs are not used. Newest first by createdAt then ID. Read and resolved are independent.
        No recipient email, visit reason, SMTP error or email job internals are exposed.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: unread
          in: query
          description: Omit for all; true selects unread, false selects read notices.
          schema:
            type: boolean
        - name: needsAction
          in: query
          description: Omit for all resolution states; true selects unresolved disruptions regardless of read state, false selects resolved history. Combines with unread when both are supplied. Pagination totals use the same recipient and filters as the returned records.
          schema:
            type: boolean
      responses:
        "200":
          description: Own notifications, including original Warsaw appointment snapshots and resolution status.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark an owned notification read, idempotently
      description: >
        PATIENT only. Sets readAt once; repeated requests preserve its original value.
        Does not resolve a disruption, change an appointment/version, or cancel email retries.
        No body is required or used. Missing and another patient's notices both return 404.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Owned notice with readAt set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      description: ADMIN/RECEPTIONIST/MANAGER list all appointments with exact status filtering; DOCTOR receives assigned appointments only. Patients use their own user appointment endpoint. Manager read access does not permit ordinary booking, cancellation, rescheduling, outcomes or deletion; only existing disrupted recovery/cancellation is allowed. Manager nested identities omit contact details and profile metadata.
      operationId: listAppointments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentStatusQuery"
      responses:
        "200":
          description: Appointments returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Appointments]
      summary: Create a new appointment from an available calendar slot
      description: >
        Only PATIENT (authenticated identity) and RECEPTIONIST may create appointments. ADMIN, MANAGER and DOCTOR receive 403, including when submitting a taken-slot alternative to this same endpoint. Admin list/detail/filter and cancellation/outcome permissions are unchanged. Online and receptionist-created bookings are confirmed immediately. Atomic initial booking. HTTP 409 with code SLOT_UNAVAILABLE means the selected slot
        was booked/blocked or lost its atomic claim; no appointment was created. Only this code
        should trigger GET /calendars/{calendarId}/alternatives. Patient overlap and other business
        conflicts retain CONFLICT; validation and ambiguous network failures must not trigger
        suggestions. Confirm an alternative by submitting a new POST /appointments, not reschedule.
      operationId: requestAppointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreateRequest"
      responses:
        "201":
          description: Appointment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SLOT_UNAVAILABLE for a booked/blocked slot or lost claim; CONFLICT for patient overlap and other business conflicts. No appointment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /appointments/{appointmentId}/alternatives:
    get:
      tags: [Appointments]
      summary: Suggest replacements for a disrupted appointment
      description: >
        MANAGER may access disrupted-appointment recommendations when covering reception.
        PATIENT (own appointment only) or RECEPTIONIST. Requires NEEDS_RESCHEDULING;
        other statuses return 409. Anchors to the current disrupted calendar and doctor,
        including after previous moves. Searches that Europe/Warsaw clinic date and the
        following 14 calendar days, inclusive, using clinic midnights across DST.
        Returns two independent groups of at most 3 eligible slots. Keep your day contains
        other doctors with the same known specialization on the anchor clinic date, ordered
        by absolute elapsed proximity to the current slot start. Keep your doctor contains
        the current doctor on later clinic dates, earliest first (also with null specialization).
        Ties use start time, doctor ID, then slot ID. Both groups require future, published,
        unblocked, unbooked slots of exactly the current duration, with no overlap with the
        patient's other CONFIRMED appointments; back-to-back is allowed. Empty or elapsed
        windows return empty groups. No reservation or other writes occur. Manual browsing
        remains available beyond the window. Check returned appointment calendarId/version
        against the open confirmation; a mismatch requires explicit reload. The transactional
        POST reschedule endpoint remains authoritative.
      operationId: listAppointmentAlternatives
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      responses:
        "200":
          description: Current appointment snapshot, inclusive clinic-date window, and independent suggestion groups.
          content:
            application/json:
              schema:
                type: object
                required: [appointment, window, keepYourDay, keepYourDoctor]
                properties:
                  appointment:
                    $ref: "#/components/schemas/Appointment"
                  window:
                    type: object
                    required: [startDate, endDate, timeZone]
                    properties:
                      startDate:
                        type: string
                        format: date
                      endDate:
                        type: string
                        format: date
                      timeZone:
                        type: string
                        enum: [Europe/Warsaw]
                  keepYourDay:
                    type: array
                    maxItems: 3
                    items:
                      $ref: "#/components/schemas/Calendar"
                  keepYourDoctor:
                    type: array
                    maxItems: 3
                    items:
                      $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Appointment does not need rescheduling; reload the appointment before continuing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /appointments/{appointmentId}/reschedule-options:
    get:
      tags: [Appointments]
      summary: Browse suitable replacement slots for an appointment
      description: >
        MANAGER may browse only NEEDS_RESCHEDULING appointments when covering reception.
        PATIENT (own appointment only) or RECEPTIONIST. Applies current status/cutoff,
        future/published/unblocked/unbooked, exact duration, specialization and patient
        CONFIRMED-overlap rules. Original doctor's slots appear first, then alternatives;
        each group is chronological. Returns no other patient appointment details.
        Browsing reserves nothing. Compare returned calendarId and version with the open
        confirmation; any mismatch requires explicit reload. POST rechecks all eligibility.
      operationId: listRescheduleOptions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      responses:
        "200":
          description: Current appointment snapshot and suitable slots (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [appointment, data]
                properties:
                  appointment:
                    $ref: "#/components/schemas/Appointment"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Current appointment status or cutoff does not permit a move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /appointments/{appointmentId}/reschedule:
    post:
      tags: [Appointments]
      summary: Move an appointment atomically and append rescheduling history
      description: >
        PATIENT (own appointments only), RECEPTIONIST, and MANAGER for NEEDS_RESCHEDULING only. Retains appointment ID and
        visit reason. Both currentCalendarId and expectedVersion must match locked state;
        stale confirmations, including A-to-B-to-A moves, return 409 instructing reload.
        CONFIRMED appointments require at least 24 elapsed hours before their current start
        for patients; receptionists may move them strictly before that start. NEEDS_RESCHEDULING
        appointments are exempt from both original-time cutoffs, even after their time passed.
        CANCELLED, COMPLETED and NO_SHOW cannot move. Replacement must be different, future,
        published, unblocked, unbooked, and have exactly the same elapsed duration. A different
        doctor requires non-null equal specialization enums; the same doctor is allowed with
        null specialization. Only other CONFIRMED appointments prevent patient overlaps;
        adjacent intervals are allowed. Success claims the replacement, updates doctor/calendar
        and status to CONFIRMED, increments version, safely releases the old reservation without
        clearing its block, and appends exactly one history entry. Recovery moves regain the normal
        cutoff at their new confirmed time. History reason and confirming actor are server-assigned.
        History counts moves; version includes other appointment edits and blocking and is not a move count.
        All writes roll back on failure. Doctor locks are acquired in ascending ID order before
        patient and appointment locks. Ordinary booking uses the same patient overlap protection.
      operationId: rescheduleAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleAppointmentRequest"
      responses:
        "200":
          description: Same appointment ID, updated location/version and the newly appended immutable time snapshots
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Appointment"
                  - type: object
                    required: [historyEntry, rescheduleCount]
                    properties:
                      rescheduleCount:
                        type: integer
                        minimum: 1
                        description: Count of persisted history entries, not the appointment version.
                      historyEntry:
                        $ref: "#/components/schemas/AppointmentRescheduleHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale confirmation (reload required), cutoff/status/eligibility failure, patient overlap or unavailable replacement; no writes committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /appointments/{appointmentId}:
    get:
      tags: [Appointments]
      summary: Get a single appointment by id
      description: Patients may read only their own appointments; doctors only appointments assigned to them. Admins, receptionists and managers may read any appointment. Manager read access does not expand mutation permissions. Manager nested identities contain only patient id/name/closedAt and doctor id/name/specialization.
      operationId: getAppointmentById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      responses:
        "200":
          description: Appointment returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Appointments]
      summary: Update appointment status
      description: >-
        Requires displayed expectedVersion and currentCalendarId; stale/ABA requests return 409 with reload instructions.
        PATIENT may cancel only their own visits; DOCTOR may update only assigned visits. ADMIN/RECEPTIONIST may update any visit.
        MANAGER may only cancel a current unresolved disruption. CONFIRMED may become CANCELLED strictly before start;
        COMPLETED or NO_SHOW require scheduled end <= server time and ADMIN/RECEPTIONIST/assigned DOCTOR.
        NEEDS_RESCHEDULING may become CANCELLED without an original-time cutoff, but all roles must supply current
        notificationId and disruptionVersion. For a genuine legacy disruption with no notification for the locked appointment/version, legacyDisruption=true explicitly permits cancellation with displayed version/calendar and no case fields; it never bypasses an existing notification. Terminal outcomes are immutable. Time and mutable state are rechecked after locks.
        Authorized staff may record outcomes for retained closed-patient visits; closed-patient booking/moves/deletion stay forbidden.
        Visit reason is preserved. Each transition increments version and atomically appends old/new status, actor and server timestamp.
        Cancellation resolves cases/jobs and safely releases isBooked without clearing isBlocked; outcomes keep historical reservations.
      operationId: reviewAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdateRequest"
      responses:
        "200":
          description: Appointment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Appointments]
      summary: Delete an appointment
      description: Appointment deletion is rejected with 409. Cancel eligible appointments instead; legacy records and all status/rescheduling history remain preserved.
      operationId: deleteAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentIdPath"
      responses:
        "204":
          description: Appointment deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIdPath:
      in: path
      name: userId
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    DoctorIdPath:
      in: path
      name: doctorId
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    CalendarIdPath:
      in: path
      name: calendarId
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    AppointmentIdPath:
      in: path
      name: appointmentId
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    DoctorIdQuery:
      in: query
      name: doctorId
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
    CalendarDateQuery:
      in: query
      description: Filter by the slot start date in Europe/Warsaw (clinic midnight inclusive to next midnight exclusive).
      name: date
      required: false
      schema:
        type: string
        format: date
    CalendarBookedQuery:
      in: query
      description: Staff booking-status filter; false excludes blocked slots. For patients, all valid values are overridden by mandatory future, published, unblocked, unbooked visibility.
      name: isBooked
      required: false
      schema:
        type: boolean
    RoleQuery:
      in: query
      name: role
      required: false
      schema:
        $ref: "#/components/schemas/Role"
    UserSearchQuery:
      in: query
      name: search
      required: false
      description: Case-insensitive search by user name or email.
      schema:
        type: string
        minLength: 2
        maxLength: 100
    PageQuery:
      in: query
      name: page
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSizeQuery:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    AppointmentStatusQuery:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/AppointmentStatus"

  responses:
    BadRequest:
      description: Request body or parameters failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing token or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user does not have permission for this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists or violates a uniqueness constraint
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ContactOutcome:
      type: string
      enum: [REACHED_PATIENT, NO_ANSWER, BUSY, VOICEMAIL_LEFT, WRONG_NUMBER]
    ContactAttemptRequest:
      type: object
      required: [notificationId, disruptionVersion, currentCalendarId, expectedVersion, outcome, idempotencyKey]
      additionalProperties: false
      properties:
        notificationId: { type: integer, minimum: 1, maximum: 2147483647 }
        disruptionVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        currentCalendarId: { type: integer, minimum: 1, maximum: 2147483647 }
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        outcome: { $ref: "#/components/schemas/ContactOutcome" }
        note: { type: string, maxLength: 500 }
        idempotencyKey: { type: string, format: uuid }
    ContactAttempt:
      type: object
      properties:
        id: { type: integer }
        notificationId: { type: integer }
        actorId: { type: integer, nullable: true }
        actorRef: { type: integer }
        appointmentVersion: { type: integer }
        currentCalendarId: { type: integer }
        outcome: { $ref: "#/components/schemas/ContactOutcome" }
        note: { type: string, maxLength: 500, nullable: true }
        createdAt: { type: string, format: date-time }
    FollowUpCase:
      type: object
      properties:
        notificationId: { type: integer }
        disruptionVersion: { type: integer }
        appointmentId: { type: integer }
        currentCalendarId: { type: integer }
        expectedVersion: { type: integer }
        patient:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string, nullable: true }
        contactability: { type: string, enum: [PHONE_AVAILABLE, PHONE_MISSING] }
        doctorName: { type: string }
        slotStartTime: { type: string, format: date-time }
        slotEndTime: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time, nullable: true, description: Exact post-lock recording time for new cases; unknown for legacy cases. }
        notificationCreatedAt: { type: string, format: date-time }
        timingBasis: { type: string, enum: [EXACT_POST_LOCK, LEGACY_UNKNOWN] }
        legacyEscalatedAt: { type: string, format: date-time, nullable: true, description: Conservative migration-policy activation time, never a historical disruption time. }
        scheduledDeadlineAt: { type: string, format: date-time, nullable: true, description: Unknown for historical cases rather than inferred from transaction-start time. }
        effectiveEscalationAt: { type: string, format: date-time }
        phoneContactDueAt: { type: string, format: date-time }
        nextContactAllowedAt: { type: string, format: date-time }
        contactAllowedNow: { type: boolean }
        reasons: { type: array, items: { type: string, enum: [DEADLINE_REACHED, EMAIL_FAILED, LEGACY_FALLBACK] } }
        contactSummary:
          type: object
          properties:
            count: { type: integer }
            last: { allOf: [{ $ref: "#/components/schemas/ContactAttempt" }], nullable: true }
        actions:
          type: object
          properties:
            recordContact: { type: boolean }
            reschedule: { type: boolean }
            cancel: { type: boolean }

    PublishedSchedulePeriod:
      type: object
      required: [id, doctorId, startDate, endDate, workingWeekdays, dailyStartTime, dailyEndTime, slotDurationMinutes, excludedDates, removedSlotIds, publishedById, createdAt, timeZone, slotCount]
      properties:
        id:
          type: integer
        doctorId:
          type: integer
        startDate:
          type: string
          format: date-time
          description: Inclusive civil date stored as a PostgreSQL DATE and serialized at UTC midnight.
        endDate:
          type: string
          format: date-time
        workingWeekdays:
          type: array
          items:
            type: integer
        dailyStartTime:
          type: string
        dailyEndTime:
          type: string
        slotDurationMinutes:
          type: integer
        excludedDates:
          type: array
          items:
            type: string
            format: date
        removedSlotIds:
          type: array
          items:
            type: integer
        publishedById:
          type: integer
          description: Authenticated publishing user, assigned by the server.
        createdAt:
          type: string
          format: date-time
        timeZone:
          type: string
          enum: [Europe/Warsaw]
        slotCount:
          type: integer
          minimum: 1

    SchedulePreviewRequest:
      type: object
      required: [doctorId, startDate, endDate, workingWeekdays, dailyStartTime, dailyEndTime, slotDurationMinutes, excludedDates]
      properties:
        doctorId:
          type: integer
          minimum: 1
          maximum: 2147483647
        startDate:
          type: string
          format: date
          example: "2026-11-16"
        endDate:
          type: string
          format: date
          example: "2026-11-20"
        workingWeekdays:
          type: array
          minItems: 1
          uniqueItems: true
          description: ISO weekday numbers (Monday is 1, Sunday is 7).
          items:
            type: integer
            minimum: 1
            maximum: 7
          example: [1, 3, 5]
        dailyStartTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "09:00"
        dailyEndTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Must be later than dailyStartTime on the same day.
          example: "12:00"
        slotDurationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 30
        excludedDates:
          type: array
          uniqueItems: true
          items:
            type: string
            format: date
          example: ["2026-11-18"]

    SchedulePreviewResponse:
      type: object
      required: [doctorId, timeZone, slots]
      properties:
        doctorId:
          type: integer
        timeZone:
          type: string
          enum: [Europe/Warsaw]
        slots:
          type: array
          items:
            type: object
            required: [startTime, endTime]
            properties:
              startTime:
                type: string
                format: date-time
              endTime:
                type: string
                format: date-time

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Notification:
      type: object
      required: [id, appointmentId, disruptionVersion, type, doctorName, slotStartTime, slotEndTime, createdAt, readAt, resolvedAt, href]
      properties:
        id: { type: integer }
        appointmentId: { type: integer, nullable: true }
        disruptionVersion:
          type: integer
          description: Version produced by the original blocking transition; not a version to confirm a later move with.
        type:
          type: string
          enum: [DOCTOR_UNAVAILABLE]
        doctorName: { type: string }
        slotStartTime: { type: string, format: date-time }
        slotEndTime: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        href:
          type: string
          nullable: true
          description: Authenticated appointment link; null after appointment detachment. Always fetch current state before opening recovery.

    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          example: Validation failed
        code:
          type: string
          example: BAD_REQUEST
        details:
          type: array
          items:
            type: string

    Specialization:
      type: string
      enum: [GENERAL_PRACTICE, CARDIOLOGY, NEUROLOGY, ORTHOPAEDICS, PEDIATRICS, DERMATOLOGY, OPHTHALMOLOGY, ENT, GYNAECOLOGY, UROLOGY]
      description: Fixed doctor specialization code. ENT is displayed as Ear, nose and throat.

    NullableSpecialization:
      type: string
      nullable: true
      enum: [GENERAL_PRACTICE, CARDIOLOGY, NEUROLOGY, ORTHOPAEDICS, PEDIATRICS, DERMATOLOGY, OPHTHALMOLOGY, ENT, GYNAECOLOGY, UROLOGY, null]
      description: Legacy records and non-doctors may have no specialization.

    Role:
      type: string
      enum: [PATIENT, DOCTOR, RECEPTIONIST, ADMIN, MANAGER]

    AppointmentStatus:
      type: string
      enum: [CONFIRMED, CANCELLED, COMPLETED, NO_SHOW, NEEDS_RESCHEDULING]

    OwnPatientProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            phone: { type: string, nullable: true, description: Private normalized phone, exposed only in own patient profile and registration responses. }

    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Anna Kowalska
        email:
          type: string
          format: email
          example: anna.kowalska@example.com
        role:
          $ref: "#/components/schemas/Role"
        specialization:
          $ref: "#/components/schemas/NullableSpecialization"
        closedAt:
          type: [string, "null"]
          format: date-time
          description: Closed account marker; internal authentication versions and closure receipt IDs are never exposed.
        createdAt:
          type: string
          format: date-time
          example: "2026-05-11T10:30:00Z"

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 10
        total:
          type: integer
          format: int32
          minimum: 0
          example: 23
        totalPages:
          type: integer
          format: int32
          minimum: 0
          example: 3

    UserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    PatientRegistrationRequest:
      type: object
      required: [name, email, password]
      properties:
        phone:
          type: string
          nullable: true
          description: Optional international patient phone with country code; blank clears it. Only own-patient profile editing accepts phone updates. Private to own-profile/registration and authorized follow-up responses.
          example: "+48500100200"
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255

    UserUpdateRequest:
      type: object
      required: [name, email]
      properties:
        phone:
          type: string
          nullable: true
          description: Optional international patient phone with country code; blank clears it. Only own-patient profile editing accepts phone updates. Private to own-profile/registration and authorized follow-up responses.
          example: "+48500100200"
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email

    SessionCreateRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255

    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken:
          type: string
          minLength: 20
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
        tokenType:
          type: string
          example: Bearer

    Doctor:
      type: object
      required: [id, userId, specialization, user]
      properties:
        id:
          type: integer
          format: int32
          example: 10
        userId:
          type: integer
          format: int32
          minimum: 1
          example: 2
        specialization:
          $ref: "#/components/schemas/NullableSpecialization"
        user:
          $ref: "#/components/schemas/User"

    AdminReceptionistCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255

    AdminManagerCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255

    AdminDoctorCreateRequest:
      type: object
      required: [name, email, password, specialization]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 255
        specialization:
          $ref: "#/components/schemas/Specialization"

    DoctorUpdateRequest:
      type: object
      required: [specialization]
      properties:
        specialization:
          $ref: "#/components/schemas/Specialization"

    Calendar:
      type: object
      required: [id, doctorId, startTime, endTime, isBooked, isBlocked, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int32
          example: 20
        doctorId:
          type: integer
          format: int32
          minimum: 1
          example: 10
        startTime:
          type: string
          format: date-time
          example: "2026-05-21T15:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2026-05-21T15:30:00Z"
        isBlocked:
          type: boolean
          readOnly: true
          description: Independent of reservations; cancellation never clears a block.
        isBooked:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-05-20T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-20T10:00:00Z"
        doctor:
          anyOf:
            - $ref: "#/components/schemas/Doctor"
            - $ref: "#/components/schemas/AppointmentDoctorSummary"

    CalendarCreateRequest:
      type: object
      required: [doctorId, startTime, endTime]
      properties:
        doctorId:
          type: integer
          format: int32
          minimum: 1
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time

    CalendarUpdateRequest:
      type: object
      additionalProperties: false
      required: [startTime, endTime, isBooked]
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isBooked:
          type: boolean

    AppointmentPatientSummary:
      type: object
      additionalProperties: false
      required: [id, name, closedAt]
      description: Minimal patient identity returned in manager appointment responses. No contact or credential fields.
      properties:
        id: { type: integer }
        name: { type: string }
        closedAt: { type: [string, "null"], format: date-time }
    AppointmentDoctorSummary:
      type: object
      additionalProperties: false
      required: [id, userId, specialization, user]
      properties:
        id: { type: integer }
        userId: { type: integer }
        specialization:
          anyOf:
            - $ref: "#/components/schemas/Specialization"
            - type: "null"
        user:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }

    Appointment:
      type: object
      required:
        [id, patientId, doctorId, calendarId, status, reason, version, patient, doctor]
      properties:
        disruption:
          type: [object, "null"]
          description: Current unresolved disruption identity for confirming cancellation; null for other statuses.
          properties:
            notificationId: { type: integer }
            disruptionVersion: { type: integer }
        id:
          type: integer
          format: int32
          example: 100
        patientId:
          type: integer
          format: int32
          minimum: 1
          example: 1
        doctorId:
          type: integer
          format: int32
          minimum: 1
          example: 10
        calendarId:
          type: integer
          format: int32
          minimum: 1
          example: 20
        version:
          type: integer
          minimum: 1
          readOnly: true
          description: Starts at 1; increments on successful moves and status transitions, including blocking and closure. Not a move count.
        rescheduleCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Persisted move count, included on appointment reads and successful moves.
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: Follow-up consultation for blood pressure results
        slotStartTime:
          type: string
          format: date-time
          example: "2026-05-20T14:00:00Z"
          description: Read-only value derived from the linked calendar slot.
        slotEndTime:
          type: string
          format: date-time
          example: "2026-05-20T14:30:00Z"
          description: Read-only value derived from the linked calendar slot.
        patient:
          anyOf:
            - $ref: "#/components/schemas/User"
            - $ref: "#/components/schemas/AppointmentPatientSummary"
        doctor:
          anyOf:
            - $ref: "#/components/schemas/Doctor"
            - $ref: "#/components/schemas/AppointmentDoctorSummary"

    RescheduleAppointmentRequest:
      type: object
      required: [currentCalendarId, newCalendarId, expectedVersion]
      properties:
        currentCalendarId:
          type: integer
          minimum: 1
          maximum: 2147483647
        newCalendarId:
          type: integer
          minimum: 1
          maximum: 2147483647
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Last version returned for this appointment. Reload on a stale 409; do not blindly retry old confirmations.

    AppointmentRescheduleHistory:
      type: object
      description: Append-only through the API. Snapshot doctor/calendar IDs remain meaningful even if an old unused calendar slot is later removed. Appointment and actor deletion are restricted.
      required: [id, appointmentId, appointmentVersion, previousDoctorId, newDoctorId, previousCalendarId, newCalendarId, previousStartTime, previousEndTime, newStartTime, newEndTime, reason, actorId, createdAt]
      properties:
        id:
          type: integer
        appointmentId:
          type: integer
        appointmentVersion:
          type: integer
          description: Appointment version immediately after this move; not the number of moves.
        previousDoctorId:
          type: integer
        newDoctorId:
          type: integer
        previousCalendarId:
          type: integer
        newCalendarId:
          type: integer
        previousStartTime:
          type: string
          format: date-time
        previousEndTime:
          type: string
          format: date-time
        newStartTime:
          type: string
          format: date-time
        newEndTime:
          type: string
          format: date-time
        reason:
          type: string
          enum: [DOCTOR_UNAVAILABLE, PATIENT_REQUESTED]
        actorId:
          type: integer
        createdAt:
          type: string
          format: date-time

    AppointmentCreateRequest:
      type: object
      required: [patientId, doctorId, calendarId, reason]
      properties:
        patientId:
          type: integer
          format: int32
          minimum: 1
        doctorId:
          type: integer
          format: int32
          minimum: 1
        calendarId:
          type: integer
          format: int32
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 500

    AppointmentUpdateRequest:
      type: object
      required: [status, currentCalendarId, expectedVersion]
      properties:
        legacyDisruption:
          type: boolean
          description: Explicit acknowledgement for cancelling NEEDS_RESCHEDULING when no notification exists for its current appointment/version. Requires expectedVersion/currentCalendarId and no notification identity. Rejected if a current notification row exists, including a resolved/detached one. Creates only a cancellation audit now, never a historical notice/event.
        notificationId: { type: integer, minimum: 1, description: Required for every disrupted cancellation; identifies the current unresolved case. }
        disruptionVersion: { type: integer, minimum: 1 }
        currentCalendarId: { type: integer, minimum: 1 }
        expectedVersion: { type: integer, minimum: 1, description: Required displayed version. Every status action rejects stale/ABA state with 409 and requires explicit reload. }
        status:
          type: string
          enum: [CANCELLED, COMPLETED, NO_SHOW]
          description: Confirmed cancellation is before start; outcomes are after end. Disrupted visits can only cancel here with current case identity.
        reason:
          type: string
          maxLength: 500
          deprecated: true
          description: Legacy compatibility field; ignored. The stored visit reason never changes during status transitions.
